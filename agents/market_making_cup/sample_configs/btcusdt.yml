# COMPLETE base pmm_mister config for the Agent Builders Cup — Gate BTC-USDT.
# The full field set MATTERS: a minimal config produces 0 executors (no orders). This set
# is verified to generate executors in backtest. The botcamp_mm_agent routine generates
# random variants of the TUNABLE params around this base and benches them.
# NOTE: spreads/take_profit should be re-tuned to Gate's confirmed competition maker-fee tier.
controller_name: pmm_mister
controller_type: generic
connector_name: gate_io
trading_pair: BTC-USDT
total_amount_quote: 400            # per controller; 2-controller fleet = $800

# --- tunable (the bench randomizes these) ---
buy_spreads: [0.0005]              # 0.5bp — valid at 0% maker; widen if Gate fee is nonzero
sell_spreads: [0.0005]
take_profit: 0.0001
min_base_pct: 0.2
target_base_pct: 0.5
max_base_pct: 0.8
executor_refresh_time: 300
buy_position_effectivization_time: 900
sell_position_effectivization_time: 900

# --- structural (required for the controller to actually quote) ---
buy_amounts_pct: ["1"]
sell_amounts_pct: ["1"]
buy_cooldown_time: 10
sell_cooldown_time: 10
max_active_executors_by_level: 20
open_order_type: 3
take_profit_order_type: 3
tick_mode: false
price_distance_tolerance: "0.0003"
refresh_tolerance: "0.0012"
tolerance_scaling: "1.2"
min_skew: "1"
portfolio_allocation: "0.025"
leverage: 1
position_mode: ONEWAY
position_side: BUY
position_profit_protection: true
manual_kill_switch: false
initial_positions: []

# --- global safety (conservative; organizers also impose hard limits) ---
global_pnl_reference: position
global_sl_enabled: true
global_stop_loss: "0.01"
global_sl_activation_from: target_base
global_tp_enabled: true
global_take_profit: "0.005"
global_tp_activation_from: min_base
